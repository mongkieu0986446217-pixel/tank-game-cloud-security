name: Deploy Tank Game to Azure Container Apps with Security

on:
  push:
    branches:
      - main  # Tự động kích hoạt pipeline bất cứ khi nào push code lên main

permissions:
  id-token: write  # Cần thiết để tạo OIDC token cho Cosign Keyless
  contents: read

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    steps:
    # ---------------------------------------------------------------------
    # Bước 1: Tải mã nguồn từ GitHub về runner
    # ---------------------------------------------------------------------
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # ---------------------------------------------------------------------
    # Bước 2: Đăng nhập an toàn vào Azure ACR (acrtankgame2026)
    # ---------------------------------------------------------------------
    - name: Re-login to ACR
      uses: azure/docker-login@v2
      with:
          login-server: acrtankgame2026.azurecr.io
          username: acrtankgame2026
          password: ${{ secrets.REGISTRY_PASSWORD }}

    # ---------------------------------------------------------------------
    # Bước 3: Đóng gói Docker Image
    # ---------------------------------------------------------------------
    - name: Build Docker Image
      run: |
        docker build -t acrtankgame2026.azurecr.io/tank-game:latest .

    # =========================================================================
    # PHẦN 2: TRIỂN KHAI CÁC CÔNG CỤ BẢO MẬT CHUỖI CUNG ỨNG
    # =========================================================================

    # Bước 4: Quét lỗ hổng an ninh bằng TRIVY
    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      env:
        TRIVY_USERNAME: acrtankgame2026
        TRIVY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      with:
        image-ref: 'acrtankgame2026.azurecr.io/tank-game:latest'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

    # Bước 5: Xuất danh mục linh kiện phần mềm (SBOM) bằng Syft
    - name: Generate SBOM using Syft
      uses: anchore/sbom-action@v0
      with:
        image: 'acrtankgame2026.azurecr.io/tank-game:latest'
        output-file: 'sbom.spdx.json'
        format: 'spdx-json'

    # Bước 6: Upload file SBOM lên GitHub Artifacts
    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tank-game-sbom
        path: sbom.spdx.json

    # =========================================================================
    # PHẦN 3: BÀN GIAO SẢN PHẨM VÀ KÝ SỐ CHỐNG GIẢ MẠO (COSIGN)
    # =========================================================================

    # Đăng nhập tươi lại Docker ngay trước khi Push
    - name: Re-login to ACR
      uses: azure/docker-login@v2
      with:
        login-server: acrtankgame2026.azurecr.io
        username: acrtankgame2026
        password: ${{ secrets.REGISTRY_PASSWORD }}

    # Bước 7: Push Image lên Azure ACR
    - name: Push Image to ACR
      run: |
        docker push acrtankgame2026.azurecr.io/tank-game:latest

    # Bước 8: Cài đặt công cụ Cosign
    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.5.0

    # Bước 8.5: Đăng nhập Cosign vào ACR để có quyền đẩy chữ ký
    - name: Log in Cosign to ACR
      run: |
        cosign login acrtankgame2026.azurecr.io \
          -u "acrtankgame2026" \
          -p "${{ secrets.REGISTRY_PASSWORD }}"

    # Bước 9: Đóng dấu ký số điện tử (Sign)
    - name: Sign the published Docker image
      env:
        COSIGN_EXPERIMENTAL: "1"
      run: |
        cosign sign --yes acrtankgame2026.azurecr.io/tank-game:latest

    # Bước 9.5: Xác minh chữ ký số (Verify)
    - name: Verify Image Signature
      env:
        COSIGN_EXPERIMENTAL: "1"
      run: |
        cosign verify \
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
          --certificate-identity-regexp="https://github.com/${{ github.repository }}/.*" \
          acrtankgame2026.azurecr.io/tank-game:latest

    # =========================================================================
    # PHẦN 4: DEPLOY TỰ ĐỘNG LÊN AZURE CONTAINER APP
    # =========================================================================

    # Bước 10: Đăng nhập Azure CLI
    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Bước 11: Deploy tự động lên Azure Container App
    - name: Deploy to Azure Container App
      uses: azure/container-apps-deploy-action@v2
      with:
        acrName: acrtankgame2026
        acrUsername: acrtankgame2026
        acrPassword: ${{ secrets.REGISTRY_PASSWORD }}
        containerAppName: tank-game-app
        resourceGroup: Demo-Cloud-Native
        containerAppEnvironment: managedEnvironment-DemoCloudNative-97a2
        imageToDeploy: acrtankgame2026.azurecr.io/tank-game:latest
        targetPort: 8080
        ingress: external

    # Bước 12: Kiểm tra trạng thái hoạt động của Container App
    - name: Verify ACA Revision Status
      run: |
        az containerapp show \
          --name tank-game-app \
          --resource-group Demo-Cloud-Native \
          --query "properties.provisioningState" \
          -o tsv
